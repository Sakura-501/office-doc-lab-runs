name: doc-lab-capture
'on': workflow_dispatch
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - name: Download ODT
      shell: pwsh
      run: |
        $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
        if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
          Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
        } else { throw "odt link not found" }
        Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
    - name: Install CurrentPreview x64 Word
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="CurrentPreview"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        $p = Start-Process -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml" -PassThru -Wait
        $w = Get-Item "C:\Program Files\Microsoft Office\root\Office16\wwlib.dll" -ErrorAction SilentlyContinue
        if (-not $w) { throw "install failed" }
        "wwlib: {0} bytes v{1}" -f $w.Length, $w.VersionInfo.FileVersion
    - name: Write test docs
      shell: pwsh
      run: |
        $b = ""
        [IO.File]::WriteAllBytes("$PWD\sepxZ.doc", [Convert]::FromBase64String($b))
        $b = ""
        [IO.File]::WriteAllBytes("$PWD\control.doc", [Convert]::FromBase64String($b))
    - name: Configure LocalDumps
      shell: pwsh
      run: |
        New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\WINWORD.EXE" -Force | Out-Null
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\WINWORD.EXE" -Name DumpFolder -Value "C:\dumps" -Type ExpandString
        Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\WINWORD.EXE" -Name DumpType -Value 2 -Type DWord
    - name: Build minidbg + resolve Grftgr RVA
      shell: pwsh
      run: |
        $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
        [IO.File]::WriteAllBytes("$PWD\minidbg14.cs", [Convert]::FromBase64String(""))
        & $csc /nologo /out:minidbg14.exe minidbg14.cs
        $helper = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(""))
        Add-Type -TypeDefinition $helper
        $ww = [IO.File]::ReadAllBytes("C:\Program Files\Microsoft Office\root\Office16\wwlib.dll")
        Write-Host ("wwlib bytes: " + $ww.Length)
        $sig = [byte[]](0x40,0x55,0x53,0x56,0x57,0x41,0x54,0x41,0x55,0x41,0x56,0x41,0x57,0x48,0x8D,0xAC,0x24,0x98,0xFD,0xFF,0xFF)
        $pairs = [Scan]::Resolve($ww, $sig)
        $pairStr = $pairs -join ','
        Write-Host ("GRFT PAIRS: " + $pairStr)
        Set-Content -Path grft_rvas.txt -Value $pairStr
    - name: Probe control + sepxM x2 (src buffer dumps at Grftgr entry)
      shell: pwsh
      run: |
        $word = "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE"
        $pairStr = (Get-Content grft_rvas.txt).Trim()
        $offs = "0,8,10,18,20,28,30,38,40,48,50,58,60,68,70,78,80,88,90,98,A0,A8,B0,B8,C0,C8,D0,D8,E0,E8,F0,F8,100,108,110,118,120,128,130,138,140,148,150,158,160,168,170,178,180,188,190,198,1A0,1A8,1B0,1B8,1C0,1C8,1D0,1D8,1E0,1E8,1F0,1F8,200,208,210,218,220,228,230,238,240,248,250,258,260,268,270,278,280,288,290,298,2A0,2A8,2B0,2B8,2C0,2C8,2D0,2D8,2E0,2E8,2F0,2F8,300,308,310,318,320,328,330,338,340,348,350,358,360,368,370,378,380,388,390,398,3A0,3A8,3B0,3B8,3C0,3C8,3D0,3D8,3E0,3E8,3F0,3F8,400,408,410,418,420,428,430,438,440,448,450,458,460,468,470,478,480,488,490,498,4A0,4A8,4B0,4B8,4C0,4C8,4D0,4D8,4E0,4E8,4F0,4F8,500,508,510,518,520,528,530,538,540,548,550,558,560,568,570,578,580,588,590,598,5A0,5A8,5B0,5B8,5C0,5C8,5D0,5D8,5E0,5E8,5F0,5F8,600,608,610,618,620,628,630,638,640,648,650,658,660,668,670,678,680,688,690,698,6A0,6A8,6B0,6B8,6C0,6C8,6D0,6D8,6E0,6E8,6F0,6F8,700,708,710,718,720,728,730,738,740,748,750,758,760,768,770,778,780,788,790,798,7A0,7A8,7B0,7B8,7C0,7C8,7D0,7D8,7E0,7E8,7F0,7F8"
        foreach ($n in @('control','sepxZ','sepxZ-run2')) {
          $doc = if ($n -eq 'sepxZ-run2') { "sepxZ.doc" } else { "$n.doc" }
          Write-Host "===== PROBE $n ====="
          & .\minidbg14.exe $word (Resolve-Path $doc).Path -- 50 "$pairStr" "$offs" 2>&1 | Tee-Object "probe_$n.txt" | Select-String -Pattern "HIT |rcx\+0x|end" | ForEach-Object { $_.Line }
          Get-Process WINWORD -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Remove-Item -Path 'HKCU:\Software\Microsoft\Office\16.0\Word\Resiliency' -Recurse -ErrorAction SilentlyContinue
        }
        Get-ChildItem C:\dumps -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("DUMP: " + $_.Name) }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: doc-lab-capture
        path: |
          probe_control.txt
          probe_sepxZ.txt
          probe_sepxZ-run2.txt
          grft_rvas.txt
        if-no-files-found: ignore
